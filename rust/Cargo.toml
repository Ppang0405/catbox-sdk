[package]
name = "catbox"
version = "0.1.0"
edition = "2024"
description = "Upload files to catbox.moe and litterbox.catbox.moe, as a library or with the catbox command"
license = "MIT"
repository = "https://github.com/Ppang0405/catbox-sdk"
keywords = ["catbox", "litterbox", "upload", "cli"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "catbox"
path = "src/bin/catbox/main.rs"
# The library is also called `catbox`; documenting both would collide.
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# Optimized for size: uploads are network-bound and the crypto in `ring` is hand-written
# assembly, so this costs no measurable speed and shrinks the binary from 3.3 MB to 1.3 MB.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
